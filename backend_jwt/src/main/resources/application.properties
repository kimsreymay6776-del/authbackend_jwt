
# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=backend_jwt
server.port=8080

# ===================================================================
# Database Configuration (MySQL)
# ===================================================================
# Change 'auth_db' to your MySQL database name
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Database Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Settings
# ===================================================================
# Options: update, create, create-drop, validate, none
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# JWT Configuration
# ===================================================================
# Secret key must be a Base64-encoded string (at least 256 bits / 32 bytes for HS256)
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token Expiration: 1 day in milliseconds (24 * 60 * 60 * 1000 = 86400000)
application.security.jwt.expiration=86400000

# ===================================================================
# Mail Configuration (For Sending OTP Emails)
# ===================================================================
# Replace with your SMTP provider details (e.g., Gmail, SendGrid)
# spring.mail.host=smtp.gmail.com
